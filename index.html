<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alat PDF &amp; QR</title>
<style>
:root{--bg:#eef2ee;--panel:#fff;--ink:#17231d;--mute:#5d6b63;--line:#cfd9d2;--acc:#1f6f54;--acc-ink:#fff;--field:#f6f9f6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101814;--panel:#17221c;--ink:#e6efe9;--mute:#93a39a;--line:#2a3a31;--acc:#4cc596;--acc-ink:#0c1a13;--field:#1c2a22}}
:root[data-theme="dark"]{--bg:#101814;--panel:#17221c;--ink:#e6efe9;--mute:#93a39a;--line:#2a3a31;--acc:#4cc596;--acc-ink:#0c1a13;--field:#1c2a22}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 Georgia,"Times New Roman",serif;padding:0 16px 48px}
h1,h2,button,label,select,.tab{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{max-width:960px;margin:0 auto;padding:28px 0 16px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
h1{font-size:1.9rem;margin:0;letter-spacing:-.02em}
header p{margin:4px 0 0;color:var(--mute);max-width:52ch}
main{max-width:960px;margin:0 auto}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:20px}
.tab{background:none;border:0;padding:10px 18px;font-size:1rem;color:var(--mute);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--acc);font-weight:600}
.panel{display:none}.panel.on{display:block}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px}
.grid{display:grid;gap:20px;grid-template-columns:1fr 1fr}
@media (max-width:780px){.grid{grid-template-columns:1fr}}
h2{font-size:1.05rem;margin:0 0 12px}
.drop{border:2px dashed var(--line);border-radius:10px;padding:26px;text-align:center;color:var(--mute);cursor:pointer;background:var(--field);display:block}
.drop.over,.drop:hover{border-color:var(--acc)}
.drop input{display:none}
textarea{width:100%;min-height:220px;resize:vertical;background:var(--field);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px;font:14px/1.5 ui-monospace,Consolas,monospace}
button,.btn{background:var(--acc);color:var(--acc-ink);border:0;border-radius:8px;padding:9px 14px;font-size:.9rem;cursor:pointer;font-weight:600}
button.alt{background:none;color:var(--ink);border:1px solid var(--line)}
button:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.drop:focus-within{outline:3px solid var(--acc);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opts label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--mute)}
.opts input[type=color]{width:100%;height:38px;border:1px solid var(--line);border-radius:6px;background:var(--field);padding:2px}
select,input[type=text],input[type=range]{width:100%;background:var(--field);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:7px;font-size:.9rem}
.full{grid-column:1/-1}
.check{flex-direction:row!important;align-items:center;gap:8px!important}
.check input{width:auto}
.qrbox{display:flex;justify-content:center;align-items:center;min-height:300px;background:#fff;border-radius:10px;border:1px solid var(--line);padding:12px;overflow:auto}
.qrbox canvas,.qrbox svg{max-width:100%;height:auto}
.msg{font:.85rem system-ui,sans-serif;color:var(--mute);margin:8px 0 0;min-height:1.3em}
.msg.err{color:#c0392b}
.src{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.src button{background:var(--field);color:var(--ink);border:1px solid var(--line)}
.src button[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.imgprev{max-width:100%;max-height:120px;margin-top:8px;border-radius:6px}
</style>
</head>
<body>
<header>
  <div>
    <h1>Alat PDF &amp; QR</h1>
    <p>Ambil teks dari PDF, simpan sebagai dokumen, atau ubah teks, PDF, dan gambar menjadi QR code dengan warna dan bentuk pilihan Anda.</p>
  </div>
  <button class="alt" id="themeBtn" type="button">Ganti tema</button>
</header>

<main>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" aria-selected="true" data-tab="pdf">PDF ke teks</button>
    <button class="tab" role="tab" aria-selected="false" data-tab="qr">QR code</button>
  </div>

  <!-- TAB PDF -->
  <section class="panel on" id="pdf">
    <div class="grid">
      <div class="card">
        <h2>Unggah PDF</h2>
        <label class="drop" id="pdfDrop">
          <input type="file" id="pdfInput" accept="application/pdf">
          <strong>Pilih file PDF</strong> atau seret ke sini
        </label>
        <p class="msg" id="pdfMsg"></p>
        <p class="msg">PDF hasil scan (berisi gambar saja) tidak punya teks yang bisa diambil.</p>
      </div>
      <div class="card">
        <h2>Hasil teks</h2>
        <textarea id="pdfText" placeholder="Teks dari PDF akan muncul di sini. Anda bisa mengeditnya."></textarea>
        <div class="row">
          <button type="button" data-dl="txt">Unduh .txt</button>
          <button type="button" data-dl="doc">Unduh Word (.doc)</button>
          <button type="button" data-dl="html">Unduh .html</button>
          <button type="button" data-dl="md">Unduh .md</button>
          <button type="button" class="alt" id="copyBtn">Salin</button>
          <button type="button" class="alt" id="toQr">Buat QR dari teks ini</button>
        </div>
      </div>
    </div>
  </section>

  <!-- TAB QR -->
  <section class="panel" id="qr">
    <div class="grid">
      <div class="card">
        <h2>Isi QR code</h2>
        <div class="src" id="src">
          <button type="button" data-s="text" aria-pressed="true">Teks / tautan</button>
          <button type="button" data-s="pdf" aria-pressed="false">Teks dari PDF</button>
          <button type="button" data-s="image" aria-pressed="false">Gambar</button>
        </div>
        <div id="s-text"><textarea id="qrText" style="min-height:110px" placeholder="Ketik teks atau tempel tautan, mis. https://contoh.com"></textarea></div>
        <div id="s-pdf" hidden>
          <label class="drop"><input type="file" id="qrPdf" accept="application/pdf"><strong>Pilih PDF</strong>, teksnya dimasukkan ke QR</label>
        </div>
        <div id="s-image" hidden>
          <label class="drop"><input type="file" id="qrImg" accept="image/*"><strong>Pilih gambar</strong>, akan dikecilkan agar muat</label>
          <img id="imgPrev" class="imgprev" alt="" hidden>
        </div>
        <p class="msg" id="qrInfo"></p>

        <h2 style="margin-top:18px">Tampilan</h2>
        <div class="opts">
          <label>Warna titik<input type="color" id="cDots" value="#1f6f54"></label>
          <label>Warna latar<input type="color" id="cBg" value="#ffffff"></label>
          <label>Bentuk titik
            <select id="tDots">
              <option value="square">Kotak</option><option value="rounded">Membulat</option>
              <option value="dots">Bulat</option><option value="classy">Klasik</option>
              <option value="classy-rounded">Klasik membulat</option><option value="extra-rounded">Sangat membulat</option>
            </select></label>
          <label>Bentuk sudut luar
            <select id="tCorner"><option value="square">Kotak</option><option value="dot">Bulat</option><option value="extra-rounded">Membulat</option></select></label>
          <label>Warna sudut luar<input type="color" id="cCorner" value="#17231d"></label>
          <label>Bentuk titik sudut
            <select id="tCdot"><option value="square">Kotak</option><option value="dot">Bulat</option></select></label>
          <label>Warna titik sudut<input type="color" id="cCdot" value="#17231d"></label>
          <label>Koreksi kesalahan
            <select id="ecl"><option value="L">Rendah (L)</option><option value="M" selected>Sedang (M)</option><option value="Q">Tinggi (Q)</option><option value="H">Maksimal (H)</option></select></label>
          <label class="full check"><input type="checkbox" id="grad"> Pakai gradasi pada titik</label>
          <label id="gWrap" hidden>Warna gradasi kedua<input type="color" id="cDots2" value="#d4572b"></label>
          <label class="full">Ukuran: <span id="sizeVal">300</span> px<input type="range" id="size" min="160" max="600" value="300"></label>
          <label class="full">Logo di tengah (opsional)<input type="file" id="logo" accept="image/*"></label>
          <label class="full check" id="logoRm" hidden><button type="button" class="alt" id="logoClear">Hapus logo</button></label>
        </div>
      </div>

      <div class="card">
        <h2>Pratinjau</h2>
        <div class="qrbox" id="qrBox"></div>
        <p class="msg" id="qrMsg"></p>
        <div class="row">
          <button type="button" data-q="png">Unduh PNG</button>
          <button type="button" data-q="svg">Unduh SVG</button>
          <button type="button" data-q="jpeg">Unduh JPG</button>
        </div>
      </div>
    </div>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
<script>
const $ = id => document.getElementById(id);
if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

/* ---------- Tema & tab ---------- */
$("themeBtn").onclick = () => {
  const r = document.documentElement;
  const dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme:dark)").matches;
  r.dataset.theme = dark ? "light" : "dark";
};
function showTab(n) {
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t.dataset.tab === n));
  document.querySelectorAll(".panel").forEach(p => p.classList.toggle("on", p.id === n));
}
document.querySelectorAll(".tab").forEach(t => t.onclick = () => showTab(t.dataset.tab));

/* ---------- PDF -> teks ---------- */
async function pdfToText(file, onProgress) {
  if (!window.pdfjsLib) throw new Error("Pustaka PDF gagal dimuat. Periksa koneksi internet.");
  const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
  let out = [];
  for (let i = 1; i <= pdf.numPages; i++) {
    onProgress && onProgress(i, pdf.numPages);
    const content = await (await pdf.getPage(i)).getTextContent();
    let line = "";
    content.items.forEach(it => { line += it.str; if (it.hasEOL) line += "\n"; else if (it.str && !it.str.endsWith(" ")) line += " "; });
    out.push(line.trim());
  }
  return out.join("\n\n");
}
async function handlePdf(file) {
  if (!file) return;
  $("pdfMsg").className = "msg"; $("pdfMsg").textContent = "Membaca " + file.name + "...";
  try {
    const t = await pdfToText(file, (i, n) => $("pdfMsg").textContent = `Membaca halaman ${i} dari ${n}...`);
    $("pdfText").value = t;
    $("pdfMsg").textContent = t.trim() ? `Selesai: ${t.length} karakter.` : "Tidak ada teks ditemukan. PDF ini mungkin hasil scan.";
  } catch (e) { $("pdfMsg").className = "msg err"; $("pdfMsg").textContent = "Gagal membaca PDF: " + e.message; }
}
$("pdfInput").onchange = e => handlePdf(e.target.files[0]);
const drop = $("pdfDrop");
["dragover", "dragenter"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", e => handlePdf(e.dataTransfer.files[0]));

function save(blob, name) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const toHtml = t => t.split(/\n{2,}/).map(p => "<p>" + esc(p).replace(/\n/g, "<br>") + "</p>").join("\n");
document.querySelectorAll("[data-dl]").forEach(b => b.onclick = () => {
  const t = $("pdfText").value; if (!t.trim()) return $("pdfMsg").textContent = "Belum ada teks untuk diunduh.";
  const k = b.dataset.dl;
  if (k === "txt") save(new Blob([t], { type: "text/plain;charset=utf-8" }), "hasil.txt");
  if (k === "md") save(new Blob([t], { type: "text/markdown;charset=utf-8" }), "hasil.md");
  if (k === "html") save(new Blob([`<!DOCTYPE html><html><head><meta charset="utf-8"><title>Hasil</title></head><body>${toHtml(t)}</body></html>`], { type: "text/html" }), "hasil.html");
  if (k === "doc") save(new Blob(["\ufeff", `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"></head><body style="font-family:Calibri,sans-serif">${toHtml(t)}</body></html>`], { type: "application/msword" }), "hasil.doc");
});
$("copyBtn").onclick = async () => {
  try { await navigator.clipboard.writeText($("pdfText").value); $("pdfMsg").textContent = "Teks disalin."; }
  catch { $("pdfText").select(); document.execCommand("copy"); }
};
$("toQr").onclick = () => { $("qrText").value = $("pdfText").value; setSource("text"); showTab("qr"); render(); };

/* ---------- QR code ---------- */
const qr = new QRCodeStyling({ width: 300, height: 300, data: " ", margin: 8,
  qrOptions: { errorCorrectionLevel: "M" },
  imageOptions: { margin: 4, imageSize: 0.3, crossOrigin: "anonymous" } });
qr.append($("qrBox"));
let source = "text", pdfData = "", imgData = "", logoData = "";

function setSource(s) {
  source = s;
  document.querySelectorAll("#src button").forEach(b => b.setAttribute("aria-pressed", b.dataset.s === s));
  ["text", "pdf", "image"].forEach(k => $("s-" + k).hidden = k !== s);
  render();
}
document.querySelectorAll("#src button").forEach(b => b.onclick = () => setSource(b.dataset.s));

function currentData() {
  return source === "text" ? $("qrText").value : source === "pdf" ? pdfData : imgData;
}
function render() {
  const data = currentData();
  const info = $("qrInfo"), msg = $("qrMsg");
  msg.className = "msg"; msg.textContent = "";
  info.textContent = data ? `${data.length} karakter (batas sekitar 2.900).` : "";
  const dots = $("grad").checked
    ? { type: $("tDots").value, color: $("cDots").value, gradient: { type: "linear", rotation: 0.8, colorStops: [{ offset: 0, color: $("cDots").value }, { offset: 1, color: $("cDots2").value }] } }
    : { type: $("tDots").value, color: $("cDots").value, gradient: null };
  const size = +$("size").value;
  try {
    qr.update({
      width: size, height: size, data: data || " ",
      image: logoData || undefined,
      dotsOptions: dots,
      backgroundOptions: { color: $("cBg").value },
      cornersSquareOptions: { type: $("tCorner").value, color: $("cCorner").value },
      cornersDotOptions: { type: $("tCdot").value, color: $("cCdot").value },
      qrOptions: { errorCorrectionLevel: logoData ? "H" : $("ecl").value }
    });
    if (data.length > 2900) { msg.className = "msg err"; msg.textContent = "Isi terlalu panjang untuk satu QR code. Persingkat teksnya."; }
    else if (!data) msg.textContent = "Isi dulu datanya untuk membuat QR code.";
  } catch (e) { msg.className = "msg err"; msg.textContent = "QR tidak bisa dibuat: isi terlalu panjang. Persingkat teksnya."; }
}
["qrText", "cDots", "cBg", "tDots", "tCorner", "cCorner", "tCdot", "cCdot", "ecl", "cDots2", "size"].forEach(id => $(id).addEventListener("input", () => { $("sizeVal").textContent = $("size").value; render(); }));
$("grad").onchange = () => { $("gWrap").hidden = !$("grad").checked; render(); };

const readDataUrl = f => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(f); });
$("logo").onchange = async e => { if (e.target.files[0]) { logoData = await readDataUrl(e.target.files[0]); $("logoRm").hidden = false; render(); } };
$("logoClear").onclick = () => { logoData = ""; $("logo").value = ""; $("logoRm").hidden = true; render(); };

$("qrPdf").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  $("qrInfo").textContent = "Membaca PDF...";
  try { pdfData = (await pdfToText(f)).replace(/\s+/g, " ").trim(); if (!pdfData) $("qrMsg").textContent = "PDF tidak berisi teks."; render(); }
  catch (err) { $("qrMsg").className = "msg err"; $("qrMsg").textContent = "Gagal membaca PDF: " + err.message; }
};

// Gambar: dikecilkan sampai muat di QR, lalu disimpan sebagai data URL (teks).
async function shrinkImage(file) {
  const src = await readDataUrl(file);
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
  for (const max of [128, 96, 72, 56, 40, 32, 24]) {
    for (const q of [0.5, 0.3, 0.15]) {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.max(1, Math.round(img.width * s)); c.height = Math.max(1, Math.round(img.height * s));
      const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
      const url = c.toDataURL("image/jpeg", q);
      if (url.length <= 2500) return url;
    }
  }
  return "";
}
$("qrImg").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    imgData = await shrinkImage(f);
    const p = $("imgPrev"); p.hidden = !imgData; p.src = imgData;
    if (!imgData) { $("qrMsg").className = "msg err"; $("qrMsg").textContent = "Gambar terlalu rumit untuk dimuat ke QR."; }
    render();
    if (imgData) $("qrMsg").textContent = "Gambar dikecilkan dan disimpan sebagai teks di QR. Pemindai hanya menampilkan teks data gambarnya; untuk membagikan gambar utuh, unggah dulu lalu buat QR dari tautannya.";
  } catch { $("qrMsg").className = "msg err"; $("qrMsg").textContent = "Gambar tidak bisa dibaca."; }
};

document.querySelectorAll("[data-q]").forEach(b => b.onclick = () => {
  if (!currentData()) return $("qrMsg").textContent = "Isi dulu datanya sebelum mengunduh.";
  qr.download({ name: "qrcode", extension: b.dataset.q });
});
render();
</script>
</body>
</html>
